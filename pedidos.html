<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Haz tu pedido | MrWingsAlcoy</title>

    <meta name="description" content="Pide tus alitas favoritas en MrWingsAlcoy. Elige sabores, combos, salsas y bebidas con delivery en Alcoy.">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NOTIFICACIÓN DEL CARRITO -->
<div id="cart-notification" class="cart-notification">
    ✓ Producto añadido al carrito
</div>

<!-- CARRITO FLOTANTE -->
<a href="#pedido"
   class="cart-float"
   id="open-cart"
   aria-label="Abrir carrito">
    🛒
    <span id="cart-count">0</span>
</a>

<!-- WHATSAPP FLOTANTE -->
<a href="https://wa.me/34611210874"
   class="whatsapp-button"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Pedir por WhatsApp">
    <i class="bi bi-whatsapp"></i>
</a>

<!-- CARRITO LATERAL -->
<div id="cart-overlay" class="cart-overlay"></div>

<aside id="cart-drawer" class="cart-drawer" aria-label="Carrito de compra">

    <div class="cart-drawer-header">
        <h2>MI <span>CARRITO</span></h2>

        <button type="button"
                id="close-cart"
                class="close-cart"
                aria-label="Cerrar carrito">
            ✕
        </button>
    </div>

    <div id="cart-items">
        <p class="cart-empty">
            🛒 Tu carrito está vacío.
            ¡Añade tus alitas favoritas!
        </p>
    </div>

    <button type="button" id="clear-cart" class="clear-cart">
        🗑️ VACIAR CARRITO
    </button>

    <div class="cart-total">
        <span>TOTAL:</span>
        <strong id="cart-total">0,00 €</strong>
    </div>

    <button type="button" id="checkout-button" class="btn-order">
        CONTINUAR CON EL PEDIDO
    </button>

</aside>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
