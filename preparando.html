<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrWingsAlcoy - Preparando pedido</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #151515;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contenedor {
            padding: 30px;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff8c00;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .cargador {
            width: 55px;
            height: 55px;
            border: 5px solid #444;
            border-top: 5px solid #ff8c00;
            border-radius: 50%;
            margin: 0 auto 30px;
            animation: girar 1s linear infinite;
        }

        h2 {
            font-size: 21px;
            margin-bottom: 12px;
        }

        p {
            color: #bbb;
            font-size: 15px;
            line-height: 1.6;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="logo">🍗</div>

        <h1>MrWingsAlcoy</h1>

        <div class="cargador"></div>

        <h2>Estamos preparando tu pedido</h2>

        <p>
            En unos segundos te llevaremos a WhatsApp.<br>
            ¡Gracias por elegirnos!
        </p>
<a href="/" style="
    display:inline-block;
    margin-top:25px;
    padding:15px 25px;
    background:#ff8c00;
    color:#151515;
    text-decoration:none;
    font-weight:bold;
    border-radius:10px;
">
    VOLVER A MRWINGSALCOY 🍗
</a>
    </div>
<script>
    let salioAWhatsApp = false;

    document.addEventListener("visibilitychange", function() {

        if (document.visibilityState === "hidden") {
            salioAWhatsApp = true;
        }

        if (document.visibilityState === "visible" && salioAWhatsApp) {

            window.close();

            setTimeout(function() {
                if (!window.closed) {
                    window.location.replace("/");
                }
            }, 300);

        }

    });
</script>
</body>
</html>
